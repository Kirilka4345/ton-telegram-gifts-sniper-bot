[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ton-telegram-gifts-sniper"
version = "1.1.0"
authors = [
  { name="Kirill" },
]
description = "An experimental HTML scraper and local report generator for Fragment gift listings."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/Kirilka4345/ton-telegram-gifts-sniper-bot"

[tool.setuptools]
py-modules = ["ton_gifts_sniper"]
